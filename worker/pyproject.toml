[project]
name = "icecap"
version = "0.1.0"
description = "IceCap Development Intelligence — ingestion worker, scheduler, notifications and API"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
browser = ["playwright>=1.44"]

[project.scripts]
icecap = "icecap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["icecap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
